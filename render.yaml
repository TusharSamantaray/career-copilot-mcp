# One-click free hosting on Render: https://render.com/deploy
# Render builds from this repo, generates the secrets, and redeploys on
# every push to main. The free plan sleeps after 15 idle minutes and has no
# persistent disk, so it is for demos, not real users (see docs/SETUP.md).
services:
  - type: web
    name: career-copilot
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Sign in with GitHub (recommended): create a GitHub OAuth app with
      # callback https://<your-service>.onrender.com/auth/callback and paste
      # its id and secret here. When set, API keys are ignored.
      - key: CAREER_COPILOT_GITHUB_CLIENT_ID
        sync: false
      - key: CAREER_COPILOT_GITHUB_CLIENT_SECRET
        sync: false
      # Optional invite list: comma-separated GitHub usernames.
      - key: CAREER_COPILOT_ALLOWED_GITHUB_USERS
        sync: false
      - key: CAREER_COPILOT_JWT_KEY
        generateValue: true
      - key: CAREER_COPILOT_USER_SALT
        generateValue: true
      # Encrypts each person's data with their own key. Never change it
      # once set, or stored data can't be read.
      - key: CAREER_COPILOT_MASTER_KEY
        generateValue: true
      # Fallback when GitHub sign-in isn't set up.
      - key: CAREER_COPILOT_API_KEY
        generateValue: true
      - key: CAREER_COPILOT_INSIGHTS_SALT
        generateValue: true
      - key: CAREER_COPILOT_ADMIN_KEY
        generateValue: true
