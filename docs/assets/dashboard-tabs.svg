<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Career Copilot dashboard: a top bar with streak, live applications, items due and runway; tabs Today, Pipeline, Prep, Money, Direction; and the Today view with a momentum ring and one step">
