  <line x1="0" y1="112" x2="960" y2="112" stroke="#E2DDD1"/>
  <rect x="28" y="136" width="904" height="132" rx="14" fill="#FFFDF8" stroke="#E2DDD1"/>
  <circle cx="98" cy="202" r="40" fill="none" stroke="#EFEBE1" stroke-width="12"/>
  <circle cx="98" cy="202" r="40" fill="none" stroke="#1F6F5C" stroke-width="12" stroke-linecap="round" stroke-dasharray="179 251" transform="rotate(-90 98 202)"/>
