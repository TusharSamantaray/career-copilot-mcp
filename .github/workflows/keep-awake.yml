# Free hosts sleep when idle, and a cold start can make claude.ai or
# ChatGPT give up on the first connect. This pings /health every 10 minutes.
# Set the repo variable HEALTH_URL (Settings → Secrets and variables →
# Actions → Variables) to https://<server>/health. Unset, it does nothing.
name: Keep awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.HEALTH_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.HEALTH_URL }}"
